<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UniPulse - 高校风向标</title>
<style>
:root{--navy:#0f1b2d;--gold:#c9a84c;--cream:#faf6ed;--card:#fff;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--success:#16a34a;--danger:#dc2626;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;background:var(--cream);color:#1f2937;line-height:1.6}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 18px;font-size:.9rem;font-weight:600;transition:all .2s}
input,select,textarea{border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.9rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

/* Nav */
nav{background:var(--navy);padding:0 24px;display:flex;align-items:center;height:60px;position:sticky;top:0;z-index:100}
nav .logo{color:var(--gold);font-size:1.3rem;font-weight:800;letter-spacing:-.5px;margin-right:32px}
nav .nav-links{display:flex;gap:4px;flex:1}
nav .nav-links a{color:rgba(255,255,255,.7);padding:8px 16px;border-radius:8px;font-size:.9rem;transition:all .2s}
nav .nav-links a:hover,nav .nav-links a.active{color:#fff;background:rgba(255,255,255,.1)}
nav .user-area{display:flex;align-items:center;gap:12px}
nav .user-area .username{color:var(--gold);font-weight:600;font-size:.9rem}
nav .user-area button{background:rgba(255,255,255,.1);color:#fff;font-size:.8rem;padding:6px 14px}
nav .user-area button:hover{background:rgba(255,255,255,.2)}

/* Main */
main{max-width:1200px;margin:0 auto;padding:24px}
.page{display:none}
.page.active{display:block}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;transition:transform .2s,box-shadow .2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card h3{font-size:1.1rem;margin-bottom:8px}
.card .tag{display:inline-block;background:#f0f4ff;color:var(--accent);padding:2px 10px;border-radius:20px;font-size:.75rem;margin-right:6px;margin-bottom:6px}
.card .meta{color:var(--muted);font-size:.85rem;margin-top:8px}
.card .score-bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:10px;overflow:hidden}
.card .score-bar .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),#f0c040)}

/* Detail */
.detail{max-width:800px;margin:0 auto}
.detail h1{font-size:1.8rem;margin-bottom:8px}
.detail .sub{color:var(--muted);font-size:1rem;margin-bottom:24px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin:24px 0}
.metric-card{background:#f9fafb;border-radius:10px;padding:16px;text-align:center}
.metric-card .label{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.metric-card .value{font-size:1.4rem;font-weight:700;color:var(--navy)}
.back-btn{background:#f3f4f6;color:#374151;margin-bottom:16px;font-size:.85rem}
.back-btn:hover{background:#e5e7eb}

/* Forum */
.post-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;cursor:pointer}
.post-item h3{font-size:1.05rem;margin-bottom:6px}
.post-item .post-meta{color:var(--muted);font-size:.85rem;display:flex;gap:16px}
.comment-box{background:#f9fafb;border-radius:10px;padding:16px;margin-top:12px}
.comment-box .author{font-weight:600;font-size:.9rem;color:var(--navy)}
.comment-box .text{font-size:.9rem;margin-top:4px}
.reply-form{margin-top:20px;display:flex;gap:10px}
.reply-form textarea{flex:1;resize:vertical;min-height:60px}
.reply-form button{background:var(--accent);color:#fff;align-self:flex-end}

/* Report Form */
.report-form{max-width:600px;margin:0 auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px}
.report-form h2{font-size:1.4rem;margin-bottom:20px;color:var(--navy)}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.form-group .hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.submit-btn{width:100%;background:var(--navy);color:var(--gold);padding:14px;font-size:1rem;border-radius:10px;margin-top:8px}
.submit-btn:hover{background:#1a2b42}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}

/* Report Result */
.report-result{max-width:800px;margin:0 auto}
.report-result h2{font-size:1.4rem;margin-bottom:8px}
.report-result .summary{color:var(--muted);margin-bottom:24px}
.uni-rec{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;display:flex;gap:20px;align-items:center}
.uni-rec .rank-badge{width:48px;height:48px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0}
.uni-rec .info h3{font-size:1.05rem}
.uni-rec .info .match{font-size:.85rem;color:var(--success);font-weight:600}
.uni-rec .info .reasons{font-size:.85rem;color:var(--muted);margin-top:4px}
.uni-rec .score-ring{width:56px;height:56px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:var(--navy);flex-shrink:0}

/* Auth */
.auth-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center}
.auth-box{background:#fff;border-radius:16px;padding:32px;width:400px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.auth-box h2{margin-bottom:20px;color:var(--navy)}
.auth-box .form-group{margin-bottom:14px}
.auth-box .switch-link{color:var(--accent);cursor:pointer;font-size:.85rem}
.auth-box .error{color:var(--danger);font-size:.85rem;margin-top:8px}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--muted)}
.loading .spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){
  nav{padding:0 12px}
  nav .nav-links a{padding:6px 10px;font-size:.8rem}
  main{padding:16px}
  .card-grid{grid-template-columns:1fr}
  .uni-rec{flex-direction:column;text-align:center}
  .uni-rec .rank-badge{margin:0 auto}
}
</style>
</head>
<body>

<nav>
  <div class="logo">UniPulse</div>
  <div class="nav-links">
    <a href="#" onclick="showPage('discover')" id="nav-discover" class="active">发现</a>
    <a href="#" onclick="showPage('rankings')" id="nav-rankings">排名</a>
    <a href="#" onclick="showPage('forum')" id="nav-forum">论坛</a>
    <a href="#" onclick="showPage('report')" id="nav-report">AI选校</a>
  </div>
  <div class="user-area" id="user-area">
    <button onclick="showAuth()" id="login-btn">登录</button>
  </div>
</nav>

<main>
  <!-- Discover Page -->
  <div class="page active" id="page-discover">
    <h2>探索全球高校</h2>
    <div style="margin-top:16px;display:flex;gap:12px">
      <input type="text" id="search-input" placeholder="搜索大学名称..." style="max-width:400px" oninput="filterUniversities()">
      <select id="region-filter" style="max-width:200px" onchange="filterUniversities()">
        <option value="">全部国家</option>
      </select>
    </div>
    <div class="card-grid" id="uni-grid"></div>
  </div>

  <!-- Rankings Page -->
  <div class="page" id="page-rankings">
    <h2>综合排名 TOP 120</h2>
    <p style="color:var(--muted);margin-top:4px">覆盖全球63个国家/地区，基于八维评分体系综合排序</p>
    <div id="ranking-list" style="margin-top:20px"></div>
  </div>

  <!-- University Detail -->
  <div class="page" id="page-detail">
    <div class="detail" id="detail-content"></div>
  </div>

  <!-- Forum Page -->
  <div class="page" id="page-forum">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>校园论坛</h2>
      <button onclick="showNewPost()" style="background:var(--accent);color:#fff" id="new-post-btn">✏️ 发帖</button>
    </div>
    <div id="forum-list" style="margin-top:20px"></div>
    <!-- New Post Form -->
    <div id="new-post-form" style="display:none;max-width:600px;margin:20px auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px">
      <h3 style="margin-bottom:16px">发布新帖</h3>
      <div class="form-group"><label>标题</label><input id="post-title" placeholder="帖子标题"></div>
      <div class="form-group"><label>内容</label><textarea id="post-content" rows="5" placeholder="分享你的看法..."></textarea></div>
      <div style="display:flex;gap:10px">
        <button onclick="submitPost()" style="background:var(--accent);color:#fff">发布</button>
        <button onclick="hideNewPost()" style="background:#f3f4f6;color:#374151">取消</button>
      </div>
      <div id="post-error" class="error" style="display:none"></div>
    </div>
  </div>

  <!-- Forum Post Detail -->
  <div class="page" id="page-forum-detail">
    <div class="detail" id="forum-detail-content"></div>
  </div>

  <!-- AI Report Page -->
  <div class="page" id="page-report">
    <div id="report-form-container">
      <div class="report-form">
        <h2>🎯 AI 智能选校报告</h2>
        <p style="color:var(--muted);margin-bottom:20px">输入你的条件，免费获取个性化院校推荐</p>
        <div class="form-group">
          <label>GPA（满分5.0）</label>
          <input type="number" id="r-gpa" min="0" max="5" step="0.1" value="3.5">
        </div>
        <div class="form-group">
          <label>意向专业</label>
          <input type="text" id="r-major" placeholder="如：计算机科学、商科、工程、医学...">
        </div>
        <div class="form-group">
          <label>偏好地区（逗号分隔）</label>
          <input type="text" id="r-regions" placeholder="如：美国,英国，留空不限">
        </div>
        <div class="form-group">
          <label>预算范围</label>
          <select id="r-budget">
            <option value="不限">不限</option>
            <option value="0-20万">0-20万/年</option>
            <option value="20-50万">20-50万/年</option>
            <option value="50万以上">50万以上/年</option>
          </select>
        </div>
        <div class="form-group">
          <label>语言成绩</label>
          <input type="text" id="r-language" placeholder="如：托福100、雅思7、待定">
        </div>
        <button class="submit-btn" onclick="generateReport()" id="report-btn">🚀 生成选校报告</button>
        <div class="hint" style="text-align:center;margin-top:12px;color:var(--muted)">免费 · 即时生成 · 基于公开数据综合分析</div>
      </div>
    </div>
    <div id="report-result-container" style="display:none"></div>
  </div>
</main>

<!-- Auth Modal -->
<div class="auth-overlay" id="auth-overlay" style="display:none">
  <div class="auth-box">
    <div id="auth-login">
      <h2>登录 UniPulse</h2>
      <div class="form-group"><label>邮箱</label><input type="email" id="login-email"></div>
      <div class="form-group"><label>密码</label><input type="password" id="login-password"></div>
      <button onclick="doLogin()" style="width:100%;background:var(--navy);color:var(--gold);padding:12px;margin-top:8px">登录</button>
      <p style="text-align:center;margin-top:12px;font-size:.9rem">没有账号？<span class="switch-link" onclick="toggleAuth()">注册</span></p>
      <div id="login-error" class="error" style="display:none"></div>
    </div>
    <div id="auth-register" style="display:none">
      <h2>注册 UniPulse</h2>
      <div class="form-group"><label>用户名</label><input id="reg-username"></div>
      <div class="form-group"><label>邮箱</label><input type="email" id="reg-email"></div>
      <div class="form-group"><label>密码</label><input type="password" id="reg-password"></div>
      <button onclick="doRegister()" style="width:100%;background:var(--navy);color:var(--gold);padding:12px;margin-top:8px">注册</button>
      <p style="text-align:center;margin-top:12px;font-size:.9rem">已有账号？<span class="switch-link" onclick="toggleAuth()">登录</span></p>
      <div id="reg-error" class="error" style="display:none"></div>
    </div>
    <button onclick="hideAuth()" style="position:absolute;top:12px;right:16px;background:none;color:var(--muted);font-size:1.3rem">✕</button>
  </div>
</div>

<script>
// ── State ──
const API = '';
let token = localStorage.getItem('unipulse_token');
let currentUser = JSON.parse(localStorage.getItem('unipulse_user') || 'null');
let universities = [];
let forumPosts = [];

// ── API helper ──
async function api(method, path, body) {
  const h = {'Content-Type':'application/json'};
  if (token) h['Authorization'] = 'Bearer ' + token;
  const opt = {method, headers: h};
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + path, opt);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

// ── Auth ──
function showAuth() { document.getElementById('auth-overlay').style.display = 'flex'; }
function hideAuth() { document.getElementById('auth-overlay').style.display = 'none'; }
function toggleAuth() {
  const l = document.getElementById('auth-login');
  const r = document.getElementById('auth-register');
  l.style.display = l.style.display === 'none' ? 'block' : 'none';
  r.style.display = r.style.display === 'none' ? 'block' : 'none';
}

async function doLogin() {
  try {
    const d = await api('POST', '/api/auth/login', {
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
    token = d.token; currentUser = d.user;
    localStorage.setItem('unipulse_token', token);
    localStorage.setItem('unipulse_user', JSON.stringify(currentUser));
    hideAuth(); updateUserUI();
  } catch(e) { showError('login-error', e.message); }
}

async function doRegister() {
  try {
    const d = await api('POST', '/api/auth/register', {
      username: document.getElementById('reg-username').value,
      email: document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value
    });
    token = d.token; currentUser = d.user;
    localStorage.setItem('unipulse_token', token);
    localStorage.setItem('unipulse_user', JSON.stringify(currentUser));
    hideAuth(); updateUserUI();
  } catch(e) { showError('reg-error', e.message); }
}

function doLogout() {
  token = null; currentUser = null;
  localStorage.removeItem('unipulse_token');
  localStorage.removeItem('unipulse_user');
  updateUserUI();
}

function updateUserUI() {
  const area = document.getElementById('user-area');
  if (currentUser) {
    area.innerHTML = `<span class="username">👋 ${currentUser.username}</span>
      <button onclick="doLogout()">退出</button>`;
  } else {
    area.innerHTML = `<button onclick="showAuth()" id="login-btn">登录</button>`;
  }
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

// ── Navigation ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  const page = document.getElementById('page-' + name);
  if (page) page.classList.add('active');
  const nav = document.getElementById('nav-' + name);
  if (nav) nav.classList.add('active');
  if (name === 'forum') loadForum();
}

// ── Universities ──
let _gridPage = 0, _gridAll = [], _gridPageSize = 40;

async function loadUniversities() {
  try {
    const data = await api('GET', '/api/universities');
    universities = data;
    // 动态填充国家下拉列表
    const sel = document.getElementById('region-filter');
    const countries = [...new Set(data.map(u => u.country))].sort();
    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
    filterUniversities();
    renderRankings(data);
  } catch(e) { console.error('加载高校失败:', e); }
}

function renderUniversityGrid(list) {
  const grid = document.getElementById('uni-grid');
  _gridAll = list; _gridPage = 0;
  grid.innerHTML = '';
  appendGridPage();
}

function appendGridPage() {
  const grid = document.getElementById('uni-grid');
  const slice = _gridAll.slice(_gridPage * _gridPageSize, (_gridPage + 1) * _gridPageSize);
 _gridPage++;
  slice.forEach(u => {
    const avg = u.metrics ? Object.values(u.metrics).reduce((a,b)=>a+b,0)/Object.values(u.metrics).length : 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => showDetail(u.id);
    card.innerHTML = `<h3>${u.cn||u.name}</h3>
      <div>${(u.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="meta">${u.country||''} · QS #${u.rank||'—'}</div>
      <div class="score-bar"><div class="fill" style="width:${avg}%"></div></div>`;
    grid.appendChild(card);
  });
  // 加载更多按钮
  let more = document.getElementById('load-more-btn');
  if (more) more.remove();
  if (_gridPage * _gridPageSize < _gridAll.length) {
    const btn = document.createElement('button');
    btn.id = 'load-more-btn';
    btn.textContent = `加载更多 (${_gridAll.length - _gridPage * _gridPageSize} 所)`;
    btn.style = 'display:block;margin:20px auto;padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem';
    btn.onclick = appendGridPage;
    grid.parentElement.insertBefore(btn, grid.nextSibling);
  }
}

function renderRankings(list) {
  const sorted = [...list].sort((a,b) => (a.rank||999) - (b.rank||999));
  document.getElementById('ranking-list').innerHTML = sorted.map((u,i) => {
    const avg = u.metrics ? Object.values(u.metrics).reduce((a,b)=>a+b,0)/Object.values(u.metrics).length : 0;
    const medal = i < 3 ? ['🥇','🥈','🥉'][i] : `${i+1}`;
    return `<div class="post-item" onclick="showDetail(${u.id})" style="display:flex;justify-content:space-between;align-items:center">
      <div><span style="font-size:1.3rem;margin-right:12px">${medal}</span><strong>${u.cn||u.name}</strong>
      <span style="color:var(--muted);font-size:.85rem;margin-left:8px">${u.country||''}</span></div>
      <div style="text-align:right"><div style="font-weight:700;color:var(--navy)">${avg.toFixed(1)}</div>
      <div style="font-size:.8rem;color:var(--muted)">QS #${u.rank||'—'}</div></div>
    </div>`;
  }).join('');
}

function filterUniversities() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const region = document.getElementById('region-filter').value;
  let filtered = universities;
  if (q) filtered = filtered.filter(u => (u.cn||u.name).toLowerCase().includes(q) || (u.country||'').toLowerCase().includes(q));
  if (region) filtered = filtered.filter(u => (u.country||'').includes(region) || (u.region||'').includes(region));
  renderUniversityGrid(filtered);
}

async function showDetail(id) {
  try {
    const u = await api('GET', `/api/universities/${id}`);
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-detail').classList.add('active');
    const dims = ['学术声誉','雇主声誉','师生比','国际化','论文引用','研究成果','教学水平','就业率'];
    const keys = ['academic','employer','ratio','international','citations','research','teaching','employment'];
    document.getElementById('detail-content').innerHTML = `
      <button class="back-btn" onclick="showPage('discover')">← 返回列表</button>
      <h1>${u.cn||u.name}</h1>
      <div class="sub">${u.name} · ${u.country||''} · QS #${u.rank||'—'}</div>
      <p style="margin-bottom:24px">${u.description||''}</p>
      ${(u.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
      <h3 style="margin-top:24px;margin-bottom:12px">八维评分</h3>
      <div class="metrics-grid">${keys.map((k,i) => `
        <div class="metric-card"><div class="label">${dims[i]}</div>
        <div class="value">${u.metrics&&u.metrics[k]!=null?u.metrics[k]:'—'}</div></div>`).join('')}
      </div>`;
  } catch(e) { alert('加载详情失败: ' + e.message); }
}

// ── Forum ──
async function loadForum() {
  try {
    forumPosts = await api('GET', '/api/forum/posts');
    document.getElementById('forum-list').innerHTML = forumPosts.map(p => `
      <div class="post-item" onclick="showForumPost(${p.id})">
        <h3>${p.title}</h3>
        <div class="post-meta">
          <span>✍️ ${p.author||'匿名'}</span>
          <span>📂 ${p.category||p.cat||''}</span>
          <span>👀 ${p.views||0}</span>
          <span>💬 ${(p.comments_count||p.comment_count||0)}</span>
        </div>
      </div>`).join('');
  } catch(e) { console.error('加载论坛失败:', e); }
}

async function showForumPost(id) {
  try {
    const p = await api('GET', `/api/forum/posts/${id}`);
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
    document.getElementById('page-forum-detail').classList.add('active');
    const comments = (p.comments||[]).map(c => `
      <div class="comment-box"><div class="author">${c.author||'匿名'}</div>
      <div class="text">${c.content||c.text||''}</div></div>`).join('');
    document.getElementById('forum-detail-content').innerHTML = `
      <button class="back-btn" onclick="showPage('forum')">← 返回论坛</button>
      <h1>${p.title}</h1>
      <div class="sub">✍️ ${p.author||'匿名'} · 📂 ${p.category||p.cat||''} · 👀 ${p.views||0}</div>
      <p style="margin-top:16px;white-space:pre-line">${p.content||''}</p>
      <h3 style="margin-top:24px">评论 (${(p.comments||[]).length})</h3>
      ${comments}
      <div class="reply-form">
        <textarea id="reply-content" placeholder="${currentUser?'写下你的评论...':'请先登录后评论'}" ${currentUser?'':'disabled'}></textarea>
        <button onclick="submitComment(${p.id})" ${currentUser?'':'disabled'}>发送</button>
      </div>`;
  } catch(e) { alert('加载帖子失败: ' + e.message); }
}

function showNewPost() {
  if (!currentUser) { showAuth(); return; }
  document.getElementById('new-post-form').style.display = 'block';
}
function hideNewPost() { document.getElementById('new-post-form').style.display = 'none'; }

async function submitPost() {
  try {
    await api('POST', '/api/forum/posts', {
      title: document.getElementById('post-title').value,
      content: document.getElementById('post-content').value,
      category: '校园生活'
    });
    hideNewPost(); loadForum();
  } catch(e) { showError('post-error', e.message); }
}

async function submitComment(postId) {
  const content = document.getElementById('reply-content').value;
  if (!content.trim()) return;
  try {
    await api('POST', `/api/forum/posts/${postId}/comments`, { content });
    showForumPost(postId);
  } catch(e) { alert('评论失败: ' + e.message); }
}

// ── AI Report ──
async function generateReport() {
  const gpa = document.getElementById('r-gpa').value;
  const major = document.getElementById('r-major').value;
  if (!major.trim()) { alert('请填写意向专业'); return; }
  
  const btn = document.getElementById('report-btn');
  btn.disabled = true; btn.textContent = '⏳ 生成中...';
  
  const params = new URLSearchParams({
    gpa, major,
    regions: document.getElementById('r-regions').value || '不限',
    budget: document.getElementById('r-budget').value,
    language: document.getElementById('r-language').value || '待定'
  });
  
  try {
    const resp = await api('POST', `/api/ai/report?${params}`);
    // Poll for result
    let result = null;
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 1000));
      const data = await api('GET', `/api/ai/report/${resp.report_id}`);
      if (data.status === 'done') { result = data.result; break; }
    }
    if (!result) { alert('报告生成超时'); return; }
    renderReport(result);
  } catch(e) { alert('生成失败: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '🚀 生成选校报告'; }
}

function renderReport(r) {
  document.getElementById('report-form-container').style.display = 'none';
  const container = document.getElementById('report-result-container');
  container.style.display = 'block';
  
  container.innerHTML = `
    <div class="report-result">
      <button class="back-btn" onclick="backToReportForm()">← 重新选校</button>
      <h2>🎯 你的专属选校报告</h2>
      <p class="summary">${r.summary}</p>
      <div style="background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:24px;border-left:4px solid var(--gold)">
        <div style="font-weight:600;margin-bottom:8px">你的条件</div>
        <div style="font-size:.9rem;color:var(--muted)">
          GPA: ${r.input.gpa} · 专业: ${r.input.major} · 地区: ${r.input.regions.join(',') || '不限'} · 预算: ${r.input.budget} · 语言: ${r.input.language}
        </div>
      </div>
      <h3>🏆 推荐院校 TOP3</h3>
      ${(r.top_recommendations||[]).map((u,i) => `
        <div class="uni-rec" onclick="showDetail(${u.id})" style="cursor:pointer">
          <div class="rank-badge">${i+1}</div>
          <div class="info" style="flex:1">
            <h3>${u.cn} <span style="color:var(--muted);font-weight:400;font-size:.9rem">${u.name}</span></h3>
            <div class="match">匹配度 ${u.score}%</div>
            <div class="reasons">${(u.match_reasons||[]).join(' · ')}</div>
            <div style="font-size:.8rem;color:var(--muted);margin-top:2px">${u.country||''} · QS #${u.rank||'—'}</div>
          </div>
          <div class="score-ring">${u.score}</div>
        </div>`).join('')}
      ${r.other_options && r.other_options.length ? `
        <h3 style="margin-top:24px">📋 其他可选院校</h3>
        ${r.other_options.map(u => `
          <div class="post-item" onclick="showDetail(${u.id})" style="cursor:pointer">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div><strong>${u.cn}</strong> <span style="color:var(--muted);font-size:.85rem">${u.country||''}</span></div>
              <div style="color:var(--success);font-weight:600">${u.score}%</div>
            </div>
          </div>`).join('')}` : ''}
      <div style="margin-top:24px;padding:16px;background:#fef3c7;border-radius:10px;font-size:.85rem;color:#92400e">
        ⚠️ ${r.ai_notice || '本报告基于公开数据综合分析，仅供参考。'}
      </div>
      <div style="text-align:center;margin-top:24px">
        <p style="color:var(--muted);font-size:.9rem">生成时间: ${r.generated_at} · 共匹配 ${r.total_matched} 所院校</p>
      </div>
    </div>`;
}

function backToReportForm() {
  document.getElementById('report-form-container').style.display = 'block';
  document.getElementById('report-result-container').style.display = 'none';
}

// ── Init ──
updateUserUI();
loadUniversities();
</script>
</body>
</html>
