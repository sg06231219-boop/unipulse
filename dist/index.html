<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniPulse - 全球高校风向标</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--soft:#94a3b8;--gold:#fbbf24;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--purple:#a855f7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--blue);text-decoration:none}
button{cursor:pointer;font:inherit;border:none;border-radius:8px;padding:8px 16px;transition:opacity .2s}
button:hover{opacity:.85}
input,select,textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}

/* Nav */
nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:100}
nav .logo{font-size:20px;font-weight:700;color:var(--gold);cursor:pointer}
nav .tabs{display:flex;gap:4px}
nav .tabs button{background:transparent;color:var(--soft);padding:8px 14px;font-size:14px;border-radius:6px}
nav .tabs button.active{background:var(--blue);color:#fff}

/* Main */
main{max-width:1200px;margin:0 auto;padding:20px}
.page{display:none}
.page.active{display:block}

/* Hero */
.hero{text-align:center;padding:40px 20px 30px}
.hero h1{font-size:28px;margin-bottom:8px}
.hero p{color:var(--soft);margin-bottom:20px}
.search-box{display:flex;gap:8px;max-width:560px;margin:0 auto}
.search-box input{flex:1;padding:10px 14px;font-size:15px}
.search-box button{background:var(--blue);color:#fff;padding:10px 20px;white-space:nowrap}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;align-items:center}
.filters select{padding:6px 10px;font-size:13px}
.stat{color:var(--soft);font-size:13px;margin-left:auto}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--blue)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.card-info h3{font-size:15px;margin-bottom:2px}
.card-info .loc{font-size:12px;color:var(--soft)}
.card-score{margin-left:auto;text-align:center}
.card-score .num{font-size:22px;font-weight:700;color:var(--gold)}
.card-score .label{font-size:10px;color:var(--soft)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(59,130,246,.15);color:var(--blue)}
.metrics{display:flex;gap:12px;font-size:12px;color:var(--soft)}
.metrics span b{color:var(--text)}

/* Load more */
.load-more{text-align:center;margin:24px 0}
.load-more button{background:var(--card);color:var(--blue);border:1px solid var(--border);padding:10px 32px;font-size:14px}

/* Rankings table */
.rank-table{width:100%;border-collapse:collapse}
.rank-table th,.rank-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.rank-table th{color:var(--soft);font-weight:500}
.rank-table tr{cursor:pointer;transition:background .15s}
.rank-table tr:hover{background:var(--card)}
.rank-pos{font-weight:700;color:var(--gold)}
.rank-pos.top3{font-size:18px}

/* Programs */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.prog-card h4{margin-bottom:10px;font-size:15px}
.prog-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.prog-rank{font-weight:700;color:var(--gold);width:28px}

/* Forum */
.forum-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.post-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.post-card:hover{border-color:var(--blue)}
.post-card h4{font-size:14px;margin-bottom:4px}
.post-card .meta{font-size:12px;color:var(--soft)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;position:relative}
.modal-close{position:absolute;top:12px;right:12px;background:transparent;color:var(--soft);font-size:20px;padding:4px 8px}
.modal h2{font-size:20px;margin-bottom:16px}
.modal .loc{color:var(--soft);font-size:14px;margin-bottom:16px}
.metric-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.metric-row .label{width:80px;text-align:right;flex-shrink:0}
.metric-row .bar-bg{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.metric-row .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.metric-row .val{width:32px;font-weight:600}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--blue);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:300}
.toast.show{opacity:1}

/* Spinner */
.spinner{text-align:center;padding:20px;color:var(--soft)}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .search-box{flex-direction:column}
  nav{padding:0 12px;gap:8px}
}
</style>
</head>
<body>
<nav>
  <div class="logo" id="logoHome">UniPulse</div>
  <div class="tabs">
    <button class="active" data-page="discover">🏫 发现</button>
    <button data-page="rankings">📊 排名</button>
    <button data-page="programs">🎓 专业</button>
    <button data-page="forum">💬 论坛</button>
  </div>
</nav>

<main>
  <!-- Discover -->
  <div class="page active" id="page-discover">
    <div class="hero">
      <h1>找到最适合你的那所大学</h1>
      <p>全球高校评价与社区讨论平台</p>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="搜索大学名称、国家、专业...">
        <button id="searchBtn">🔍 搜索</button>
      </div>
    </div>
    <div class="filters">
      <select id="regionFilter">
        <option value="all">全部地区</option>
        <option value="北美">北美</option>
        <option value="欧洲">欧洲</option>
        <option value="亚洲">亚洲</option>
        <option value="大洋洲">大洋洲</option>
        <option value="南美">南美</option>
        <option value="非洲">非洲</option>
      </select>
      <span class="stat" id="resultStat"></span>
    </div>
    <div class="grid" id="uniGrid"></div>
    <div class="load-more" id="loadMoreWrap" style="display:none">
      <button id="loadMoreBtn">加载更多</button>
    </div>
    <div class="spinner" id="discoverSpinner" style="display:none">加载中...</div>
  </div>

  <!-- Rankings -->
  <div class="page" id="page-rankings">
    <h2 style="margin-bottom:16px">🏆 全球高校综合排名</h2>
    <div id="rankContent"></div>
    <div class="spinner" id="rankSpinner" style="display:none">加载中...</div>
  </div>

  <!-- Programs -->
  <div class="page" id="page-programs">
    <h2 style="margin-bottom:16px">🎓 学科专业排名</h2>
    <div class="prog-grid" id="progGrid"></div>
  </div>

  <!-- Forum -->
  <div class="page" id="page-forum">
    <div class="forum-header">
      <h2>💬 社区讨论</h2>
      <button style="background:var(--blue);color:#fff" id="newPostBtn">+ 发布话题</button>
    </div>
    <div id="forumList"></div>
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
  var API = '/api';
  var curPage = 'discover';
  var uniPage = 1;
  var uniLoading = false;
  var uniAllLoaded = false;
  var curRegion = 'all';
  var curSearch = '';
  var toastTimer = null;

  // ── Helpers ──
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }
  function barColor(v){
    if(v==null) return 'var(--soft)';
    if(v>=85) return 'var(--green)';
    if(v>=70) return 'var(--gold)';
    return 'var(--red)';
  }

  // ── Navigation ──
  function switchPage(name){
    curPage = name;
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    var el = $('page-' + name);
    if(el) el.classList.add('active');
    document.querySelectorAll('nav .tabs button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-page') === name);
    });
    if(name === 'rankings') loadRankings();
    if(name === 'programs') loadPrograms();
    if(name === 'forum') loadForum();
  }

  // ── Discover ──
  function resetDiscover(){
    uniPage = 1; uniAllLoaded = false;
    $('uniGrid').innerHTML = '';
    loadUniversities();
  }

  function loadUniversities(){
    if(uniLoading || uniAllLoaded) return;
    uniLoading = true;
    $('discoverSpinner').style.display = 'block';
    var url = API + '/universities?page=' + uniPage + '&size=30';
    if(curRegion !== 'all') url += '&region=' + encodeURIComponent(curRegion);
    if(curSearch) url += '&search=' + encodeURIComponent(curSearch);
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      var items = data.items || [];
      var total = data.total || 0;
      $('resultStat').textContent = '共 ' + total + ' 所高校';
      if(items.length < 30) uniAllLoaded = true;
      var grid = $('uniGrid');
      items.forEach(function(u){
        var m = u.metrics || {};
        var tagsHtml = (u.tags||[]).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('');
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="card-top">' +
            '<div class="logo-circle" style="background:' + esc(u.logo||'#334155') + '">' + esc(u.initials||'?') + '</div>' +
            '<div class="card-info"><h3>' + esc(u.cn) + '</h3><div class="loc">' + esc(u.loc) + '</div></div>' +
            '<div class="card-score"><div class="num">' + esc(u.score) + '</div><div class="label">/100</div></div>' +
          '</div>' +
          (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
          '<div class="metrics">' +
            '<span>学术 <b>' + (m.academic!=null?m.academic:'--') + '</b></span>' +
            '<span>校园 <b>' + (m.campus!=null?m.campus:'--') + '</b></span>' +
            '<span>就业 <b>' + (m.career!=null?m.career:'--') + '</b></span>' +
          '</div>';
        card.addEventListener('click', function(){ openDetail(u.id); });
        grid.appendChild(card);
      });
      uniPage++;
      $('loadMoreWrap').style.display = uniAllLoaded ? 'none' : 'block';
      $('discoverSpinner').style.display = 'none';
      uniLoading = false;
    }).catch(function(e){
      $('discoverSpinner').style.display = 'none';
      uniLoading = false;
      toast('加载失败: ' + e.message);
    });
  }

  // ── Detail Modal ──
  function openDetail(id){
    fetch(API + '/universities/' + id).then(function(r){ return r.json(); }).then(function(u){
      var m = u.metrics || {};
      var dims = [
        {key:'academic',label:'学术水平'},{key:'research',label:'科研产出'},
        {key:'reputation',label:'行业声誉'},{key:'campus',label:'校园环境'},
        {key:'support',label:'学生关怀'},{key:'international',label:'国际化'},
        {key:'value',label:'性价比'},{key:'career',label:'就业前景'}
      ];
      var metricsHtml = dims.map(function(d){
        var v = m[d.key];
        var pct = v != null ? v : 0;
        var color = barColor(v);
        return '<div class="metric-row">' +
          '<span class="label">' + d.label + '</span>' +
          '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
          '<span class="val">' + (v!=null?v:'--') + '</span></div>';
      }).join('');
      var tagsHtml = (u.tags||[]).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      $('modalBody').innerHTML =
        '<h2>' + esc(u.cn) + '</h2>' +
        '<div class="loc">' + esc(u.name) + ' · ' + esc(u.loc) + '</div>' +
        (u.description ? '<p style="margin-bottom:16px;color:var(--soft);font-size:14px">' + esc(u.description) + '</p>' : '') +
        (tagsHtml ? '<div class="tags" style="margin-bottom:16px">' + tagsHtml + '</div>' : '') +
        '<h3 style="font-size:15px;margin-bottom:12px">📊 多维评分</h3>' +
        metricsHtml +
        '<div style="margin-top:16px;font-size:12px;color:var(--soft)">排名 #' + esc(u.rank) + ' · ' + '★'.repeat(Math.round(u.stars||0)) + ' ' + esc(u.stars||0) + '/5 · ' + esc(u.reviews||0) + ' 条评价</div>';
      $('modalBg').classList.add('open');
    }).catch(function(e){ toast('加载失败: ' + e.message); });
  }

  function closeModal(){
    $('modalBg').classList.remove('open');
  }

  // ── Rankings (lazy load, paginated on client) ──
  var rankLoaded = false;
  function loadRankings(){
    if(rankLoaded) return;
    rankLoaded = true;
    $('rankSpinner').style.display = 'block';
    fetch(API + '/universities?size=100&page=1').then(function(r){ return r.json(); }).then(function(data){
      var items = data.items || [];
      $('rankSpinner').style.display = 'none';
      var html = '<table class="rank-table"><thead><tr><th>排名</th><th>大学</th><th>综合分</th><th>趋势</th><th>国家</th></tr></thead><tbody>';
      items.forEach(function(u, i){
        var trendIcon = u.trend === 'up' ? '📈' : u.trend === 'down' ? '📉' : '➡️';
        html += '<tr onclick="window._openDetail(' + u.id + ')">' +
          '<td class="rank-pos' + (i<3?' top3':'') + '">#' + u.rank + '</td>' +
          '<td>' + esc(u.cn) + '<br><span style="font-size:11px;color:var(--soft)">' + esc(u.name) + '</span></td>' +
          '<td style="font-weight:700;color:var(--gold)">' + esc(u.score) + '</td>' +
          '<td>' + trendIcon + ' ' + esc(u.trendV||'') + '</td>' +
          '<td>' + esc(u.country) + '</td></tr>';
      });
      html += '</tbody></table>';
      $('rankContent').innerHTML = html;
    }).catch(function(e){ $('rankSpinner').style.display='none'; toast('排名加载失败'); });
  }

  // ── Programs ──
  var progLoaded = false;
  function loadPrograms(){
    if(progLoaded) return;
    progLoaded = true;
    fetch(API + '/programs').then(function(r){ return r.json(); }).then(function(progs){
      var html = '';
      progs.forEach(function(p){
        html += '<div class="prog-card"><h4>' + (p.icon||'') + ' ' + esc(p.name) + '</h4>';
        (p.univs||[]).forEach(function(u, i){
          html += '<div class="prog-item"><span class="prog-rank">#' + (i+1) + '</span><span>' + esc(u.univ||u.name||'') + '</span><span style="color:var(--soft)">' + esc(u.tier||'') + '</span></div>';
        });
        html += '</div>';
      });
      $('progGrid').innerHTML = html || '<p style="color:var(--soft)">暂无专业数据</p>';
    }).catch(function(){ $('progGrid').innerHTML='<p style="color:var(--soft)">加载失败</p>'; });
  }

  // ── Forum ──
  var forumLoaded = false;
  function loadForum(){
    if(forumLoaded) return;
    forumLoaded = true;
    fetch(API + '/forum/posts').then(function(r){ return r.json(); }).then(function(posts){
      var html = '';
      posts.forEach(function(p){
        html += '<div class="post-card" onclick="window._openPost(' + p.id + ')">' +
          '<h4>' + esc(p.title) + '</h4>' +
          '<div class="meta">👤 ' + esc(p.author||'匿名') + ' · 💬 ' + (p.replies||0) + ' · 👁 ' + (p.views||0) + '</div></div>';
      });
      $('forumList').innerHTML = html || '<p style="color:var(--soft)">暂无帖子</p>';
    }).catch(function(){ $('forumList').innerHTML='<p style="color:var(--soft)">加载失败</p>'; });
  }

  // ── Expose for inline onclick ──
  window._openDetail = openDetail;

  // ── Bind Events ──
  document.querySelectorAll('nav .tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){ switchPage(btn.getAttribute('data-page')); });
  });
  $('logoHome').addEventListener('click', function(){ switchPage('discover'); });
  $('regionFilter').addEventListener('change', function(){
    curRegion = this.value;
    resetDiscover();
  });
  var searchTimer = null;
  $('searchInput').addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      curSearch = $('searchInput').value.trim();
      resetDiscover();
    }, 400);
  });
  $('searchBtn').addEventListener('click', function(){
    curSearch = $('searchInput').value.trim();
    resetDiscover();
  });
  $('loadMoreBtn').addEventListener('click', loadUniversities);
  $('modalClose').addEventListener('click', closeModal);
  $('modalBg').addEventListener('click', function(e){
    if(e.target === $('modalBg')) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });
  $('newPostBtn').addEventListener('click', function(){
    toast('📝 发帖功能开发中');
  });

  // ── Init ──
  loadUniversities();
})();
</script>
</body>
</html>
