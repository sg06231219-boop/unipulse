<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniPulse - 全球高校风向标</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#253349;--border:#334155;--text:#f1f5f9;--soft:#94a3b8;--gold:#fbbf24;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--purple:#a855f7;--orange:#f97316;--pink:#ec4899;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--blue);text-decoration:none}
button{cursor:pointer;font:inherit;border:none;border-radius:8px;padding:8px 16px;transition:opacity .2s}
button:hover{opacity:.85}
input,select,textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}

nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:100}
nav .logo{font-size:18px;font-weight:700;color:var(--gold);cursor:pointer;white-space:nowrap}
nav .tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
nav .tabs button{background:transparent;color:var(--soft);padding:6px 12px;font-size:13px;border-radius:6px;white-space:nowrap}
nav .tabs button.active{background:var(--blue);color:#fff}
nav .user-area{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
nav .user-area .login-btn{background:var(--blue);color:#fff;padding:5px 14px;font-size:12px}
nav .user-area .username{color:var(--gold);font-weight:600}
nav .user-area .logout-btn{background:transparent;color:var(--soft);font-size:12px;padding:5px 8px}

main{max-width:1200px;margin:0 auto;padding:16px}
.page{display:none}.page.active{display:block}

.hero{text-align:center;padding:30px 16px 20px}
.hero h1{font-size:24px;margin-bottom:6px}
.hero p{color:var(--soft);margin-bottom:16px;font-size:14px}
.search-box{display:flex;gap:8px;max-width:520px;margin:0 auto}
.search-box input{flex:1;padding:9px 14px;font-size:14px}
.search-box button{background:var(--blue);color:#fff;padding:9px 18px;white-space:nowrap}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.filters select{padding:5px 8px;font-size:12px;width:auto}
.stat{color:var(--soft);font-size:12px;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--blue)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff}
.card-info h3{font-size:14px;margin-bottom:1px}.card-info .loc{font-size:11px;color:var(--soft)}
.card-score{margin-left:auto;text-align:center}
.card-score .num{font-size:20px;font-weight:700;color:var(--gold)}.card-score .label{font-size:9px;color:var(--soft)}
.tags{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:10px;padding:1px 7px;border-radius:10px;background:rgba(59,130,246,.12);color:var(--blue)}
.metrics{display:flex;gap:10px;font-size:11px;color:var(--soft)}.metrics span b{color:var(--text)}

.load-more{text-align:center;margin:20px 0}
.load-more button{background:var(--card);color:var(--blue);border:1px solid var(--border);padding:8px 28px;font-size:13px}

.rank-table{width:100%;border-collapse:collapse}
.rank-table th,.rank-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
.rank-table th{color:var(--soft);font-weight:500}
.rank-table tr{cursor:pointer;transition:background .12s}.rank-table tr:hover{background:var(--card)}
.rank-pos{font-weight:700;color:var(--gold)}

.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.prog-card h4{margin-bottom:8px;font-size:14px}
.prog-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.prog-rank{font-weight:700;color:var(--gold);width:26px}

/* Forum */
.forum-layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
.forum-main{min-width:0}
.forum-sidebar{display:flex;flex-direction:column;gap:12px}
.forum-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.forum-header h2{font-size:18px}
.forum-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.forum-cats button{background:var(--card);color:var(--soft);border:1px solid var(--border);padding:4px 10px;font-size:11px;border-radius:14px}
.forum-cats button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.post-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .12s}
.post-card:hover{border-color:var(--blue)}
.post-card h4{font-size:13px;margin-bottom:4px;line-height:1.4}
.post-card .meta{font-size:11px;color:var(--soft);display:flex;gap:10px;flex-wrap:wrap}
.post-card .cat-tag{font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(168,85,247,.12);color:var(--purple)}
.sidebar-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.sidebar-card h4{font-size:13px;margin-bottom:8px;color:var(--gold)}
.sidebar-card .hot-item{font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);cursor:pointer;color:var(--text)}
.sidebar-card .hot-item:hover{color:var(--blue)}
.sidebar-card .hot-item:last-child{border-bottom:none}

/* Post detail */
.post-detail{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.post-detail h2{font-size:18px;margin-bottom:8px}
.post-detail .post-meta{font-size:12px;color:var(--soft);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap}
.post-detail .post-body{font-size:14px;line-height:1.7;margin-bottom:16px;white-space:pre-wrap}
.post-detail .post-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.comment-section{margin-top:16px}
.comment-section h3{font-size:15px;margin-bottom:12px}
.comment-item{background:var(--card2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.comment-item .c-author{font-size:12px;font-weight:600;color:var(--cyan)}
.comment-item .c-time{font-size:10px;color:var(--soft);margin-left:8px}
.comment-item .c-text{font-size:13px;margin-top:4px;line-height:1.5;white-space:pre-wrap}
.comment-item .c-actions{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--soft)}
.comment-item .c-actions button{background:transparent;color:var(--soft);font-size:11px;padding:2px 6px}
.comment-item .c-actions button:hover{color:var(--gold)}
.reply-box{margin-top:16px}
.reply-box textarea{min-height:80px;resize:vertical;margin-bottom:8px}
.reply-box .reply-actions{display:flex;gap:8px}
.reply-box .reply-actions button{font-size:13px}
.reply-box .submit-btn{background:var(--blue);color:#fff}
.reply-box .cancel-btn{background:var(--card);color:var(--soft);border:1px solid var(--border)}

/* Compose post */
.compose-form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.compose-form h3{margin-bottom:12px;font-size:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--soft);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{font-size:13px}
.form-group textarea{min-height:120px;resize:vertical}
.form-actions{display:flex;gap:8px}
.form-actions .submit-btn{background:var(--blue);color:#fff}
.form-actions .cancel-btn{background:var(--card);color:var(--soft);border:1px solid var(--border)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;justify-content:center;align-items:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;position:relative}
.modal-close{position:absolute;top:10px;right:10px;background:transparent;color:var(--soft);font-size:18px;padding:4px 8px}
.modal h2{font-size:18px;margin-bottom:14px}
.metric-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px}
.metric-row .label{width:70px;text-align:right;flex-shrink:0}
.metric-row .bar-bg{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.metric-row .bar-fill{height:100%;border-radius:3px}
.metric-row .val{width:28px;font-weight:600}

/* Auth modal */
.auth-modal .modal{max-width:380px}
.auth-modal .form-group{margin-bottom:10px}
.auth-modal h2{text-align:center}
.auth-switch{text-align:center;font-size:12px;color:var(--soft);margin-top:8px}
.auth-switch a{color:var(--blue);cursor:pointer}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--blue);color:var(--text);padding:8px 18px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .3s;z-index:300}
.toast.show{opacity:1}
.spinner{text-align:center;padding:16px;color:var(--soft);font-size:13px}
.back-btn{background:transparent;color:var(--soft);font-size:13px;padding:4px 8px;margin-bottom:8px}
.back-btn:hover{color:var(--text)}

@media(max-width:768px){
  .forum-layout{grid-template-columns:1fr}
  .forum-sidebar{order:-1}
  .grid{grid-template-columns:1fr}
  .search-box{flex-direction:column}
  nav{padding:0 10px;gap:6px}
  nav .tabs button{padding:5px 8px;font-size:12px}
}
</style>
</head>
<body>
<nav>
  <div class="logo" id="logoHome">🎓 UniPulse</div>
  <div class="tabs">
    <button class="active" data-page="discover">🏫 发现</button>
    <button data-page="rankings">📊 排名</button>
    <button data-page="programs">🎓 专业</button>
    <button data-page="forum">💬 论坛</button>
  </div>
  <div class="user-area" id="userArea">
    <button class="login-btn" id="loginBtn">登录</button>
  </div>
</nav>

<main>
  <!-- Discover -->
  <div class="page active" id="page-discover">
    <div class="hero">
      <h1>找到最适合你的那所大学</h1>
      <p>全球高校评价与社区讨论平台</p>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="搜索大学名称、国家、专业...">
        <button id="searchBtn">🔍 搜索</button>
      </div>
    </div>
    <div class="filters">
      <select id="regionFilter">
        <option value="all">全部地区</option>
        <option value="北美">北美</option><option value="欧洲">欧洲</option>
        <option value="亚洲">亚洲</option><option value="大洋洲">大洋洲</option>
        <option value="南美">南美</option><option value="非洲">非洲</option>
      </select>
      <span class="stat" id="resultStat"></span>
    </div>
    <div class="grid" id="uniGrid"></div>
    <div class="load-more" id="loadMoreWrap" style="display:none"><button id="loadMoreBtn">加载更多</button></div>
    <div class="spinner" id="discoverSpinner" style="display:none">加载中...</div>
  </div>

  <!-- Rankings -->
  <div class="page" id="page-rankings">
    <h2 style="margin-bottom:12px">🏆 全球高校综合排名</h2>
    <div id="rankContent"></div>
    <div class="spinner" id="rankSpinner" style="display:none">加载中...</div>
  </div>

  <!-- Programs -->
  <div class="page" id="page-programs">
    <h2 style="margin-bottom:12px">🎓 学科专业排名</h2>
    <div class="prog-grid" id="progGrid"></div>
  </div>

  <!-- Forum -->
  <div class="page" id="page-forum">
    <div id="forumContainer">
      <!-- Forum list view -->
      <div id="forumListView">
        <div class="forum-header">
          <h2>💬 社区讨论</h2>
          <button style="background:var(--blue);color:#fff;font-size:13px" id="newPostBtn">✏️ 发布话题</button>
        </div>
        <div class="forum-cats" id="forumCats"></div>
        <div class="forum-layout">
          <div class="forum-main" id="forumList"></div>
          <div class="forum-sidebar" id="forumSidebar"></div>
        </div>
      </div>
      <!-- Post detail view -->
      <div id="forumDetailView" style="display:none">
        <button class="back-btn" id="backToList">← 返回列表</button>
        <div id="postDetailContent"></div>
      </div>
      <!-- Compose view -->
      <div id="forumComposeView" style="display:none">
        <button class="back-btn" id="backFromCompose">← 返回</button>
        <div class="compose-form">
          <h3>✏️ 发布新话题</h3>
          <div class="form-group"><label>标题</label><input id="composeTitle" maxlength="100" placeholder="输入话题标题..."></div>
          <div class="form-group"><label>分类</label><select id="composeCategory"></select></div>
          <div class="form-group"><label>内容</label><textarea id="composeContent" placeholder="分享你的经验、观点或疑问..."></textarea></div>
          <div class="form-group"><label>标签（逗号分隔）</label><input id="composeTags" placeholder="如: 就业,CS,美国"></div>
          <div class="form-actions">
            <button class="submit-btn" id="submitPost">发布</button>
            <button class="cancel-btn" id="cancelPost">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Detail Modal (university) -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal-bg auth-modal" id="authModalBg">
  <div class="modal" id="authModal">
    <button class="modal-close" id="authClose">✕</button>
    <div id="authBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var API='/api';
  var TOKEN_KEY='unipulse_token';
  var USER_KEY='unipulse_user';
  var curPage='discover';
  var uniPage=1,uniLoading=false,uniAllLoaded=false,curRegion='all',curSearch='';
  var forumCat='all',forumLoaded=false;
  var currentUser=null;
  var toastTimer=null;
  var FORUM_CATS=['心理健康','校园生活','学术氛围','就业发展','人文关怀','留学申请','专业选择','院校对比','奖学金','实习','研究生','博士'];

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2500)}
  function getToken(){return localStorage.getItem(TOKEN_KEY)||''}
  function saveUser(u){localStorage.setItem(USER_KEY,JSON.stringify(u));currentUser=u;updateUserArea()}
  function loadUser(){try{var u=JSON.parse(localStorage.getItem(USER_KEY));if(u)currentUser=u}catch(e){}updateUserArea()}
  function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);currentUser=null;updateUserArea();toast('已退出登录')}
  function authHeaders(){var t=getToken();return t?{'Authorization':'Bearer '+t}:{}}

  function updateUserArea(){
    var area=$('userArea');
    if(currentUser){
      area.innerHTML='<span class="username">👤 '+esc(currentUser.username)+'</span><button class="logout-btn" id="logoutBtn">退出</button>';
      $('logoutBtn').addEventListener('click',logout);
    }else{
      area.innerHTML='<button class="login-btn" id="loginBtn">登录</button>';
      $('loginBtn').addEventListener('click',function(){showAuthModal('login')});
    }
  }

  // ── Navigation ──
  function switchPage(name){
    curPage=name;
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    var el=$('page-'+name);if(el)el.classList.add('active');
    document.querySelectorAll('nav .tabs button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-page')===name)});
    if(name==='rankings')loadRankings();
    if(name==='programs')loadPrograms();
    if(name==='forum'&&!forumLoaded)loadForum();
  }

  // ── Auth ──
  function showAuthModal(mode){
    var isLogin=mode==='login';
    var html='<h2>'+(isLogin?'🔑 登录':'📝 注册')+'</h2>';
    if(!isLogin)html+='<div class="form-group"><label>用户名</label><input id="authUsername" maxlength="30" placeholder="3-30字符"></div>';
    html+='<div class="form-group"><label>邮箱</label><input id="authEmail" type="email" placeholder="your@email.com"></div>';
    html+='<div class="form-group"><label>密码</label><input id="authPassword" type="password" placeholder="至少6位"></div>';
    html+='<button style="width:100%;background:var(--blue);color:#fff;padding:10px;font-size:14px" id="authSubmit">'+(isLogin?'登录':'注册')+'</button>';
    html+='<div class="auth-switch">'+(isLogin?'还没有账号？<a id="switchToRegister">立即注册</a>':'已有账号？<a id="switchToLogin">去登录</a>')+'</div>';
    $('authBody').innerHTML=html;
    $('authModalBg').classList.add('open');
    $('authSubmit').addEventListener('click',function(){doAuth(mode)});
    var sw=isLogin?$('switchToRegister'):$('switchToLogin');
    if(sw)sw.addEventListener('click',function(e){e.preventDefault();showAuthModal(isLogin?'register':'login')});
  }

  function doAuth(mode){
    var email=($('authEmail')||{}).value||'';
    var password=($('authPassword')||{}).value||'';
    var username=($('authUsername')||{}).value||'';
    if(!email||!password){toast('请填写邮箱和密码');return}
    if(mode==='register'&&(!username||username.length<3)){toast('用户名至少3个字符');return}
    if(password.length<6){toast('密码至少6位');return}
    var body=mode==='login'?{email:email,password:password}:{username:username,email:email,password:password};
    var url=mode==='login'?API+'/auth/login':API+'/auth/register';
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
      if(d.token){localStorage.setItem(TOKEN_KEY,d.token);saveUser(d.user||{username:username||email.split('@')[0]});$('authModalBg').classList.remove('open');toast('✅ '+(mode==='login'?'登录成功':'注册成功'))}
      else{toast(d.detail||d.message||'操作失败')}
    }).catch(function(e){toast('网络错误: '+e.message)});
  }

  // ── Discover ──
  function resetDiscover(){uniPage=1;uniAllLoaded=false;$('uniGrid').innerHTML='';loadUniversities()}

  function loadUniversities(){
    if(uniLoading||uniAllLoaded)return;
    uniLoading=true;$('discoverSpinner').style.display='block';
    var url=API+'/universities?page='+uniPage+'&size=30';
    if(curRegion!=='all')url+='&region='+encodeURIComponent(curRegion);
    if(curSearch)url+='&search='+encodeURIComponent(curSearch);
    fetch(url).then(function(r){return r.json()}).then(function(data){
      var items=data.items||[],total=data.total||0;
      $('resultStat').textContent='共 '+total+' 所高校';
      if(items.length<30)uniAllLoaded=true;
      var grid=$('uniGrid');
      items.forEach(function(u){
        var m=u.metrics||{};
        var tagsHtml=(u.tags||[]).slice(0,3).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
        var card=document.createElement('div');card.className='card';
        card.innerHTML='<div class="card-top"><div class="logo-circle" style="background:'+esc(u.logo||'#334155')+'">'+esc(u.initials||'?')+'</div><div class="card-info"><h3>'+esc(u.cn)+'</h3><div class="loc">'+esc(u.loc)+'</div></div><div class="card-score"><div class="num">'+esc(u.score)+'</div><div class="label">/100</div></div></div>'+(tagsHtml?'<div class="tags">'+tagsHtml+'</div>':'')+'<div class="metrics"><span>学术 <b>'+(m.academic!=null?m.academic:'--')+'</b></span><span>校园 <b>'+(m.campus!=null?m.campus:'--')+'</b></span><span>就业 <b>'+(m.career!=null?m.career:'--')+'</b></span></div>';
        card.addEventListener('click',function(){openDetail(u.id)});
        grid.appendChild(card);
      });
      uniPage++;$('loadMoreWrap').style.display=uniAllLoaded?'none':'block';$('discoverSpinner').style.display='none';uniLoading=false;
    }).catch(function(e){$('discoverSpinner').style.display='none';uniLoading=false;toast('加载失败: '+e.message)});
  }

  // ── University Detail ──
  function openDetail(id){
    fetch(API+'/universities/'+id).then(function(r){return r.json()}).then(function(u){
      var m=u.metrics||{};
      var dims=[{k:'academic',l:'学术水平'},{k:'research',l:'科研产出'},{k:'reputation',l:'行业声誉'},{k:'campus',l:'校园环境'},{k:'support',l:'学生关怀'},{k:'international',l:'国际化'},{k:'value',l:'性价比'},{k:'career',l:'就业前景'}];
      var mHtml=dims.map(function(d){var v=m[d.k];var pct=v!=null?v:0;var c=v>=85?'var(--green)':v>=70?'var(--gold)':'var(--red)';return '<div class="metric-row"><span class="label">'+d.l+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:'+c+'"></div></div><span class="val">'+(v!=null?v:'--')+'</span></div>'}).join('');
      var tagsHtml=(u.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
      $('modalBody').innerHTML='<h2>'+esc(u.cn)+'</h2><div style="color:var(--soft);font-size:13px;margin-bottom:12px">'+esc(u.name)+' · '+esc(u.loc)+'</div>'+(u.description?'<p style="margin-bottom:12px;color:var(--soft);font-size:13px;line-height:1.6">'+esc(u.description)+'</p>':'')+(tagsHtml?'<div class="tags" style="margin-bottom:12px">'+tagsHtml+'</div>':'')+'<h3 style="font-size:14px;margin-bottom:10px">📊 多维评分</h3>'+mHtml+'<div style="margin-top:12px;font-size:11px;color:var(--soft)">排名 #'+esc(u.rank)+' · '+'★'.repeat(Math.round(u.stars||0))+' '+esc(u.stars||0)+'/5 · '+esc(u.reviews||0)+' 条评价</div>';
      $('modalBg').classList.add('open');
    }).catch(function(e){toast('加载失败')});
  }

  // ── Rankings ──
  var rankLoaded=false;
  function loadRankings(){
    if(rankLoaded)return;rankLoaded=true;$('rankSpinner').style.display='block';
    fetch(API+'/universities?size=100&page=1').then(function(r){return r.json()}).then(function(data){
      var items=data.items||[];$('rankSpinner').style.display='none';
      var html='<table class="rank-table"><thead><tr><th>排名</th><th>大学</th><th>综合分</th><th>趋势</th><th>国家</th></tr></thead><tbody>';
      items.forEach(function(u,i){
        var ti=u.trend==='up'?'📈':u.trend==='down'?'📉':'➡️';
        html+='<tr class="rank-row" data-uid="'+u.id+'"><td class="rank-pos">#'+u.rank+'</td><td>'+esc(u.cn)+'<br><span style="font-size:10px;color:var(--soft)">'+esc(u.name)+'</span></td><td style="font-weight:700;color:var(--gold)">'+esc(u.score)+'</td><td>'+ti+' '+esc(u.trendV||'')+'</td><td>'+esc(u.country)+'</td></tr>';
      });
      html+='</tbody></table>';$('rankContent').innerHTML=html;
      document.querySelectorAll('.rank-row').forEach(function(tr){tr.addEventListener('click',function(){openDetail(parseInt(tr.getAttribute('data-uid')))})});
    }).catch(function(){$('rankSpinner').style.display='none';toast('排名加载失败')});
  }

  // ── Programs ──
  var progLoaded=false;
  function loadPrograms(){
    if(progLoaded)return;progLoaded=true;
    fetch(API+'/programs').then(function(r){return r.json()}).then(function(progs){
      var html='';
      progs.forEach(function(p){
        html+='<div class="prog-card"><h4>'+(p.icon||'')+' '+esc(p.name)+'</h4>';
        (p.univs||[]).forEach(function(u,i){html+='<div class="prog-item"><span class="prog-rank">#'+(i+1)+'</span><span>'+esc(u.univ||u.name||'')+'</span><span style="color:var(--soft)">'+esc(u.tier||'')+'</span></div>'});
        html+='</div>';
      });
      $('progGrid').innerHTML=html||'<p style="color:var(--soft)">暂无专业数据</p>';
    }).catch(function(){$('progGrid').innerHTML='<p style="color:var(--soft)">加载失败</p>'});
  }

  // ── Forum ──
  function loadForum(){
    forumLoaded=true;
    loadForumCats();
    loadForumPosts();
    loadForumHot();
  }

  function loadForumCats(){
    fetch(API+'/forum/categories').then(function(r){return r.json()}).then(function(cats){
      var html='<button class="active" data-cat="all">全部</button>';
      cats.slice(1).forEach(function(c){html+='<button data-cat="'+esc(c.key)+'">'+c.label+' ('+c.count+')</button>'});
      $('forumCats').innerHTML=html;
      $('forumCats').querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){
          $('forumCats').querySelectorAll('button').forEach(function(x){x.classList.remove('active')});
          b.classList.add('active');forumCat=b.getAttribute('data-cat');loadForumPosts();
        });
      });
    }).catch(function(){});
  }

  function loadForumPosts(){
    var url=API+'/forum/posts?limit=50';
    if(forumCat!=='all')url+='&category='+encodeURIComponent(forumCat);
    fetch(url).then(function(r){return r.json()}).then(function(posts){
      var html='';
      if(!posts.length){html='<p style="color:var(--soft);padding:20px;text-align:center">暂无帖子，来发布第一个话题吧！</p>'}
      posts.forEach(function(p){
        var catLabel=p.cat||p.category||'';
        html+='<div class="post-card" data-pid="'+p.id+'"><h4>'+esc(p.title)+'</h4><div class="meta"><span class="cat-tag">'+esc(catLabel)+'</span><span>👤 '+esc(p.author||'匿名')+'</span><span>💬 '+(p.replies||0)+'</span><span>👁 '+(p.views||0)+'</span><span>'+esc(p.time||'')+'</span></div></div>';
      });
      $('forumList').innerHTML=html;
      $('forumList').querySelectorAll('.post-card').forEach(function(c){
        c.addEventListener('click',function(){openPost(parseInt(c.getAttribute('data-pid')))});
      });
    }).catch(function(){$('forumList').innerHTML='<p style="color:var(--soft)">加载失败</p>'});
  }

  function loadForumHot(){
    fetch(API+'/forum/hot?limit=8').then(function(r){return r.json()}).then(function(items){
      var html='<div class="sidebar-card"><h4>🔥 热门话题</h4>';
      (items||[]).forEach(function(h){html+='<div class="hot-item" data-hot-title="'+esc(h.text||'')+'">'+esc(h.text||'')+' <span style="color:var(--soft);font-size:10px">👁'+esc(h.views||0)+'</span></div>'});
      html+='</div>';
      html+='<div class="sidebar-card"><h4>📋 讨论区分类</h4><div style="font-size:12px;color:var(--soft);line-height:1.8">';
      FORUM_CATS.forEach(function(c){html+='<span style="display:inline-block;margin:0 4px">· '+c+'</span>'});
      html+='</div></div>';
      $('forumSidebar').innerHTML=html;
    }).catch(function(){});
  }

  function openPost(id){
    fetch(API+'/forum/posts/'+id).then(function(r){return r.json()}).then(function(p){
      var commentsHtml='';
      (p.comments||[]).forEach(function(c){
        commentsHtml+='<div class="comment-item"><div><span class="c-author">'+esc(c.author||'匿名')+'</span><span class="c-time">'+esc(c.created_at||'')+'</span></div><div class="c-text">'+esc(c.text)+'</div><div class="c-actions"><button data-like-cid="'+c.id+'">👍 '+(c.likes||0)+'</button></div></div>';
      });
      var tagsHtml=(p.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
      var replyHtml=currentUser?'<div class="reply-box"><textarea id="replyText" placeholder="写下你的回复..."></textarea><div class="reply-actions"><button class="submit-btn" id="submitReply">回复</button></div></div>':'<p style="color:var(--soft);font-size:12px;margin-top:12px">📌 <a id="replyLoginLink" style="color:var(--blue);cursor:pointer">登录</a> 后即可回复</p>';

      $('postDetailContent').innerHTML='<div class="post-detail"><h2>'+esc(p.title)+'</h2><div class="post-meta"><span class="cat-tag">'+esc(p.cat||p.category||'')+'</span><span>👤 '+esc(p.author||'匿名')+'</span><span>👁 '+esc(p.views||0)+'</span><span>'+esc(p.time||p.created_at||'')+'</span></div>'+(tagsHtml?'<div class="post-tags">'+tagsHtml+'</div>':'')+'<div class="post-body">'+esc(p.content)+'</div><div class="comment-section"><h3>💬 评论 ('+((p.comments||[]).length)+')</h3>'+commentsHtml+'</div>'+replyHtml+'</div>';

      $('forumListView').style.display='none';
      $('forumDetailView').style.display='block';

      // Bind like buttons
      document.querySelectorAll('[data-like-cid]').forEach(function(b){
        b.addEventListener('click',function(){
          var cid=b.getAttribute('data-like-cid');
          fetch(API+'/forum/comments/'+cid+'/like',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
            b.textContent='👍 '+d.likes;toast('👍 已点赞');
          }).catch(function(){});
        });
      });

      // Bind reply
      var sr=$('submitReply');
      if(sr)sr.addEventListener('click',function(){submitReply(id)});
      var rl=$('replyLoginLink');
      if(rl)rl.addEventListener('click',function(){showAuthModal('login')});
    }).catch(function(){toast('加载失败')});
  }

  function submitReply(postId){
    var text=($('replyText')||{}).value||'';
    if(!text.trim()){toast('请输入回复内容');return}
    fetch(API+'/forum/posts/'+postId+'/comments',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({text:text})}).then(function(r){return r.json()}).then(function(d){
      if(d.id){toast('✅ 回复成功');openPost(postId)}
      else{toast(d.detail||'回复失败')}
    }).catch(function(e){toast('回复失败: '+e.message)});
  }

  function showCompose(){
    if(!currentUser){toast('请先登录');showAuthModal('login');return}
    var catSel=$('composeCategory');
    catSel.innerHTML=FORUM_CATS.map(function(c){return '<option value="'+c+'">'+c+'</option>'}).join('');
    $('composeTitle').value='';$('composeContent').value='';$('composeTags').value='';
    $('forumListView').style.display='none';$('forumDetailView').style.display='none';$('forumComposeView').style.display='block';
  }

  function submitPost(){
    var title=($('composeTitle')||{}).value||'';
    var content=($('composeContent')||{}).value||'';
    var category=($('composeCategory')||{}).value||FORUM_CATS[0];
    var tagsStr=($('composeTags')||{}).value||'';
    var tags=tagsStr?tagsStr.split(/[,，]/).map(function(t){return t.trim()}).filter(Boolean):[];
    if(!title.trim()){toast('请输入标题');return}
    if(!content.trim()){toast('请输入内容');return}
    fetch(API+'/forum/posts',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({title:title,category:category,content:content,tags:tags})}).then(function(r){return r.json()}).then(function(d){
      if(d.id){toast('✅ 发帖成功');$('forumComposeView').style.display='none';$('forumListView').style.display='block';loadForumPosts();loadForumCats()}
      else{toast(d.detail||'发帖失败')}
    }).catch(function(e){toast('发帖失败: '+e.message)});
  }

  function backToForumList(){
    $('forumListView').style.display='block';$('forumDetailView').style.display='none';$('forumComposeView').style.display='none';
  }

  // ── Modal close helpers ──
  function closeModal(){$('modalBg').classList.remove('open')}

  // ── Bind Events ──
  document.querySelectorAll('nav .tabs button').forEach(function(btn){btn.addEventListener('click',function(){switchPage(btn.getAttribute('data-page'))})});
  $('logoHome').addEventListener('click',function(){switchPage('discover')});
  $('regionFilter').addEventListener('change',function(){curRegion=this.value;resetDiscover()});
  var searchTimer=null;
  $('searchInput').addEventListener('input',function(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){curSearch=$('searchInput').value.trim();resetDiscover()},400)});
  $('searchBtn').addEventListener('click',function(){curSearch=$('searchInput').value.trim();resetDiscover()});
  $('loadMoreBtn').addEventListener('click',loadUniversities);
  $('modalClose').addEventListener('click',closeModal);
  $('modalBg').addEventListener('click',function(e){if(e.target===$('modalBg'))closeModal()});
  $('authClose').addEventListener('click',function(){$('authModalBg').classList.remove('open')});
  $('authModalBg').addEventListener('click',function(e){if(e.target===$('authModalBg'))$('authModalBg').classList.remove('open')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();$('authModalBg').classList.remove('open')}});
  $('newPostBtn').addEventListener('click',showCompose);
  $('backToList').addEventListener('click',backToForumList);
  $('backFromCompose').addEventListener('click',backToForumList);
  $('submitPost').addEventListener('click',submitPost);
  $('cancelPost').addEventListener('click',backToForumList);

  // ── Init ──
  loadUser();
  loadUniversities();
})();
</script>
</body>
</html>
